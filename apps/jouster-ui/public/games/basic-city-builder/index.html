<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic City Builder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #2c3e50;
            color: #ecf0f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .game-container {
            display: flex;
            gap: 20px;
            background: #34495e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .game-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .game-info h1 {
            font-size: 1.5em;
            color: #3498db;
            margin-bottom: 10px;
        }
        .resource-display {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .resource {
            background: #2c3e50;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.9em;
        }
        .resource .label { color: #95a5a6; font-size: 0.85em; }
        .resource .value { font-size: 1.2em; font-weight: bold; }
        .resource .income { color: #2ecc71; font-size: 0.85em; }
        .resource .income.negative { color: #e74c3c; }
        .next-day-btn {
            background: #e67e22;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: background 0.2s;
        }
        .next-day-btn:hover { background: #d35400; }
        .next-day-btn:disabled { background: #7f8c8d; cursor: not-allowed; }
        .building-selector {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .building-selector h2 {
            font-size: 1.1em;
            color: #3498db;
            margin-bottom: 5px;
        }
        .building-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #2c3e50;
            border: 2px solid transparent;
            color: #ecf0f1;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .building-btn:hover { border-color: #3498db; }
        .building-btn.selected { border-color: #3498db; background: #34495e; }
        .building-btn .icon {
            width: 30px;
            height: 30px;
            border-radius: 3px;
        }
        .building-btn .info { display: flex; flex-direction: column; }
        .building-btn .name { font-weight: bold; font-size: 0.95em; }
        .building-btn .cost { color: #e67e22; font-size: 0.85em; }
        .building-btn .pop { color: #2ecc71; font-size: 0.85em; }
        .building-btn .income-info { color: #3498db; font-size: 0.85em; }
        canvas {
            border: 2px solid #7f8c8d;
            border-radius: 5px;
            cursor: crosshair;
            background: #27ae60;
        }
        .game-over-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .game-over-box {
            background: #34495e;
            padding: 30px 40px;
            border-radius: 10px;
            text-align: center;
        }
        .game-over-box h2 { font-size: 2em; margin-bottom: 15px; }
        .game-over-box .win { color: #2ecc71; }
        .game-over-box .lose { color: #e74c3c; }
        .game-over-box p { margin-bottom: 20px; font-size: 1.1em; }
        .game-over-box button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }
        .game-over-box button:hover { background: #2980b9; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-info">
            <h1>Basic City Builder</h1>
            <div class="resource-display">
                <div class="resource">
                    <div class="label">Money</div>
                    <div class="value" id="money">$1000</div>
                </div>
                <div class="resource">
                    <div class="label">Population</div>
                    <div class="value" id="population">0</div>
                </div>
                <div class="resource">
                    <div class="label">Day</div>
                    <div class="value" id="day">1</div>
                </div>
                <div class="resource">
                    <div class="label">Daily Income</div>
                    <div class="value income" id="income">+$0</div>
                </div>
            </div>
            <button class="next-day-btn" id="next-day-btn">Next Day</button>
        </div>
        <canvas id="game-canvas" width="480" height="480"></canvas>
        <div class="building-selector">
            <h2>Buildings</h2>
            <button class="building-btn" data-building="road">
                <div class="icon" style="background: #7f8c8d;"></div>
                <div class="info">
                    <span class="name">Road</span>
                    <span class="cost">Cost: $10</span>
                </div>
            </button>
            <button class="building-btn" data-building="residential">
                <div class="icon" style="background: #3498db;"></div>
                <div class="info">
                    <span class="name">Residential</span>
                    <span class="cost">Cost: $100</span>
                    <span class="pop">Pop: +10</span>
                    <span class="income-info">Income: $5/day</span>
                </div>
            </button>
            <button class="building-btn" data-building="commercial">
                <div class="icon" style="background: #9b59b6;"></div>
                <div class="info">
                    <span class="name">Commercial</span>
                    <span class="cost">Cost: $200</span>
                    <span class="income-info">Income: $15/day</span>
                </div>
            </button>
            <button class="building-btn" data-building="industrial">
                <div class="icon" style="background: #e67e22;"></div>
                <div class="info">
                    <span class="name">Industrial</span>
                    <span class="cost">Cost: $300</span>
                    <span class="pop">Pop: +5</span>
                    <span class="income-info">Income: $20/day</span>
                </div>
            </button>
            <button class="building-btn" data-building="park">
                <div class="icon" style="background: #2ecc71;"></div>
                <div class="info">
                    <span class="name">Park</span>
                    <span class="cost">Cost: $50</span>
                    <span class="pop">Pop: +2</span>
                </div>
            </button>
            <button class="building-btn" data-building="town_hall">
                <div class="icon" style="background: #f1c40f;"></div>
                <div class="info">
                    <span class="name">Town Hall</span>
                    <span class="cost">Cost: $500</span>
                    <span class="pop">Pop: +20</span>
                </div>
            </button>
        </div>
    </div>
    <div class="game-over-overlay" id="game-over" style="display: none;">
        <div class="game-over-box">
            <h2 id="game-over-title"></h2>
            <p id="game-over-message"></p>
            <button id="restart-btn">Play Again</button>
        </div>
    </div>
    <script src="logic.js"></script>
    <script src="main.js"></script>
</body>
</html>
