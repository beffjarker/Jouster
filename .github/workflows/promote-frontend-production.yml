name: 'Promote Frontend: Staging → Production'

# Blue/green promotion: copies the artifact already running on stg.jouster.org (GREEN)
# to the jouster.org origin bucket (BLUE). Current production is snapshotted first so
# "Rollback Frontend Production" can restore it.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "promote" to copy stg.jouster.org to jouster.org'
        required: true
        type: string
      dry_run:
        description: 'Dry run (show what would change, deploy nothing)'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  PROD_DOMAIN: jouster.org
  STAGING_BUCKET: stg.jouster.org
  RELEASES_BUCKET: ${{ vars.FRONTEND_RELEASES_BUCKET || 'jouster-org-releases' }}
  PROD_BUCKET_OVERRIDE: ${{ vars.PROD_FRONTEND_BUCKET }}
  PROD_DISTRIBUTION_ID_OVERRIDE: ${{ vars.PROD_CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  promote:
    name: Promote stg.jouster.org → jouster.org
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://jouster.org
    env:
      PROD_ROLE_ARN: ${{ secrets.AWS_PROD_FRONTEND_ROLE_ARN }}
      RELEASE: .github/scripts/frontend-release.sh

    steps:
      - name: Require confirmation
        if: inputs.confirm != 'promote'
        run: |
          echo "::error::Confirmation input must be exactly 'promote'"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Configure AWS credentials (OIDC)
        if: env.PROD_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: env.PROD_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve production origin
        run: bash "$RELEASE" resolve

      - name: Show staging build
        id: staging
        run: |
          INFO=$(aws s3 cp "s3://${STAGING_BUCKET}/build-info.json" - 2>/dev/null || echo '{}')
          echo "$INFO"
          echo "sha=$(jq -r '.sha // "unknown"' <<<"$INFO")" >> "$GITHUB_OUTPUT"

      - name: Planned changes
        run: bash "$RELEASE" diff "s3://${STAGING_BUCKET}"

      - name: Snapshot current production (BLUE)
        id: snapshot
        if: ${{ !inputs.dry_run }}
        run: |
          SHA="${{ steps.staging.outputs.sha }}"
          ID=$(bash "$RELEASE" snapshot "pre-promote-${SHA:0:7}")
          echo "id=${ID}" >> "$GITHUB_OUTPUT"

      - name: Publish staging (GREEN) to production
        if: ${{ !inputs.dry_run }}
        run: bash "$RELEASE" publish "s3://${STAGING_BUCKET}"

      - name: Invalidate CloudFront
        if: ${{ !inputs.dry_run }}
        run: bash "$RELEASE" invalidate

      - name: Verify jouster.org serves the staging build
        if: ${{ !inputs.dry_run }}
        run: bash "$RELEASE" verify "s3://${STAGING_BUCKET}"

      - name: Prune old snapshots
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: bash "$RELEASE" prune

      - name: Summary
        if: always()
        run: |
          {
            echo "## Frontend promotion: stg.jouster.org → jouster.org"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Mode | ${{ inputs.dry_run && 'dry run' || 'live' }} |"
            echo "| Staging build SHA | \`${{ steps.staging.outputs.sha }}\` |"
            echo "| Production bucket | \`${PROD_BUCKET:-?}${PROD_PREFIX:-}\` |"
            echo "| CloudFront | \`${PROD_DISTRIBUTION_ID:-?}\` |"
            echo "| Rollback snapshot | \`${{ steps.snapshot.outputs.id || 'none' }}\` |"
            echo "| Result | ${{ job.status }} |"
            echo ""
            echo "To undo, run **Rollback Frontend Production** (defaults to the latest snapshot)."
          } >> "$GITHUB_STEP_SUMMARY"
