name: 'Deploy Frontend: Staging (stg.jouster.org)'

# GREEN environment. Promote to production with "Promote Frontend: Staging → Production".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: frontend-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: staging
      url: https://stg.jouster.org

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci || {
          echo "npm ci failed, falling back to npm install"
          rm -rf node_modules package-lock.json
          npm install
        }

    - name: Build application for staging
      run: |
        npm run build:prod
        echo "Built for staging environment"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::924677642513:role/GitHubActionsPreviewRole
        aws-region: us-west-2

    - name: Create staging S3 bucket if not exists
      run: |
        if ! aws s3api head-bucket --bucket stg.jouster.org 2>/dev/null; then
          echo "Creating staging S3 bucket..."
          aws s3 mb s3://stg.jouster.org --region us-west-2

          # Configure bucket for static website hosting
          aws s3 website s3://stg.jouster.org --index-document index.html --error-document index.html

          # Remove public access blocks
          aws s3api put-public-access-block \
            --bucket stg.jouster.org \
            --public-access-block-configuration "BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false"

          # Apply public read policy
          aws s3api put-bucket-policy \
            --bucket stg.jouster.org \
            --policy '{
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "PublicReadGetObject",
                  "Effect": "Allow",
                  "Principal": "*",
                  "Action": "s3:GetObject",
                  "Resource": "arn:aws:s3:::stg.jouster.org/*"
                }
              ]
            }'
          echo "Staging S3 bucket created and configured"
        else
          echo "Staging S3 bucket already exists"
        fi

    # Lets the production promotion report exactly which commit it is shipping.
    - name: Write build-info.json
      run: |
        jq -n --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF_NAME" --arg run "$GITHUB_RUN_ID" \
          --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          '{sha: $sha, ref: $ref, runId: $run, builtAt: $builtAt}' \
          > dist/apps/jouster-ui/browser/build-info.json
        cat dist/apps/jouster-ui/browser/build-info.json

    - name: Deploy to staging S3 bucket (green environment)
      run: |
        echo "Deploying to staging environment (green)..."
        aws s3 sync dist/apps/jouster-ui/browser/ s3://stg.jouster.org --delete --region us-west-2
        echo "✅ Deployment to stg.jouster.org complete!"

    # Without an invalidation CloudFront keeps serving cached objects, including
    # files that `sync --delete` removed from the bucket (e.g. a stale config.json).
    - name: Invalidate staging CloudFront cache
      run: |
        DIST_ID=$(aws cloudfront list-distributions \
          --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, 'stg.jouster.org')].Id | [0]" \
          --output text)
        if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
          echo "::warning::No CloudFront distribution found for stg.jouster.org - skipping invalidation"
          exit 0
        fi
        echo "Invalidating CloudFront distribution $DIST_ID"
        aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

    - name: Post deployment info
      run: |
        echo "🚀 Staging Deployment Complete!"
        echo "Staging Environment URLs:"
        echo "- Custom Domain: https://stg.jouster.org"
        echo "- S3 Direct: http://stg.jouster.org.s3-website-us-west-2.amazonaws.com"
        echo "- Build: ${{ github.sha }}"
        echo "- Branch: ${{ github.ref_name }}"
        echo "- Environment: GREEN (Staging)"
