name: CI

on:
  push:
    branches:
      - main
  # PRs are covered by build-preview-artifact.yml

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci
        timeout-minutes: 20

      - run: npx cypress install

      # Run tests, linting, and build
      - run: npx nx run-many -t lint test build e2e

      # Nx Cloud fixes for CI issues
      - run: npx nx fix-ci
        if: always()
