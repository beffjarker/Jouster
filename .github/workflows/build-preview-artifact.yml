name: Build and Upload Preview Artifact

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

env:
  NODE_OPTIONS: '--max_old_space_size=7168'

permissions:
  contents: read
  pull-requests: write
  deployments: write

# Serialize deploys per PR so two pushes can't race to create the same CloudFront distribution.
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    # Allows for the one-time wait while a PR's CloudFront distribution first deploys.
    timeout-minutes: 75

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies (only if cache miss)
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          echo "Installing dependencies - this may take 15-20 minutes on first run..."
          npm install --prefer-offline --no-audit --no-fund
        timeout-minutes: 25

      - name: Verify Nx is available
        run: npx nx --version

      - name: Build application
        run: npm run build:prod
        timeout-minutes: 10

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jouster-ui-build-pr${{ github.event.pull_request.number }}
          path: dist/apps/jouster-ui/browser
          retention-days: 7

      - name: Configure AWS credentials
        if: github.actor != 'dependabot[bot]'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Generate preview bucket name
        if: github.actor != 'dependabot[bot]'
        id: bucket
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          BUCKET_NAME="jouster-preview-pr${PR_NUM}"
          # Single DNS label so the existing *.jouster.org certificate covers it.
          DOMAIN="pr${PR_NUM}-preview.jouster.org"
          echo "name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          # Private S3 REST origin (read by CloudFront via OAC); the website endpoint only redirects to HTTPS.
          echo "origin=${BUCKET_NAME}.s3.us-west-2.amazonaws.com" >> $GITHUB_OUTPUT
          echo "domain=$DOMAIN" >> $GITHUB_OUTPUT
          echo "url=https://${DOMAIN}" >> $GITHUB_OUTPUT

      - name: Package backend for Lambda
        if: github.actor != 'dependabot[bot]'
        run: |
          set -euo pipefail
          echo "Installing backend production dependencies..."
          cd apps/backend
          npm ci --omit=dev --no-audit --no-fund
          echo "Zipping backend (excluding PII conversation-history JSON)..."
          zip -r -q ../../backend-pr${{ github.event.pull_request.number }}.zip . \
            -x "conversation-history/*" \
            -x "tests/*" \
            -x "scripts/*" \
            -x "*.env" \
            -x ".env*" \
            -x "*.log"
          cd ../..
          ls -lh backend-pr${{ github.event.pull_request.number }}.zip

      - name: Ensure shared Lambda IAM role
        if: github.actor != 'dependabot[bot]'
        id: iamrole
        run: |
          set -euo pipefail
          ROLE_NAME="jouster-preview-lambda-role"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          DDB_TABLE="dev-jouster-conversations"
          DDB_ARN="arn:aws:dynamodb:us-west-2:${ACCOUNT_ID}:table/${DDB_TABLE}"

          if ! aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
            echo "Creating IAM role $ROLE_NAME"
            cat > /tmp/trust.json << 'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              { "Effect": "Allow", "Principal": { "Service": "lambda.amazonaws.com" }, "Action": "sts:AssumeRole" }
            ]
          }
          EOF
            aws iam create-role --role-name "$ROLE_NAME" \
              --assume-role-policy-document file:///tmp/trust.json >/dev/null
            aws iam attach-role-policy --role-name "$ROLE_NAME" \
              --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
            echo "Waiting for role propagation..."
            sleep 10
          else
            echo "IAM role $ROLE_NAME already exists"
          fi

          cat > /tmp/ddb-policy.json << EOF
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": ["dynamodb:Scan","dynamodb:Query","dynamodb:GetItem","dynamodb:PutItem"],
                "Resource": ["${DDB_ARN}", "${DDB_ARN}/index/*"]
              }
            ]
          }
          EOF
          aws iam put-role-policy --role-name "$ROLE_NAME" \
            --policy-name jouster-preview-ddb-access \
            --policy-document file:///tmp/ddb-policy.json

          echo "role_arn=arn:aws:iam::${ACCOUNT_ID}:role/${ROLE_NAME}" >> $GITHUB_OUTPUT

      - name: Deploy preview backend (Lambda + HTTP API)
        if: github.actor != 'dependabot[bot]'
        id: backend
        run: |
          set -euo pipefail
          PR_NUM="${{ github.event.pull_request.number }}"
          FN_NAME="preview-pr${PR_NUM}-jouster-api"
          API_NAME="preview-pr${PR_NUM}-jouster-api"
          ROLE_ARN="${{ steps.iamrole.outputs.role_arn }}"
          ZIP="backend-pr${PR_NUM}.zip"
          ORIGIN="${{ steps.bucket.outputs.url }}"

          ENV_VARS="Variables={NODE_ENV=development,USE_DYNAMODB=true,DYNAMODB_TABLE=dev-jouster-conversations,CORS_ALLOWED_ORIGINS=${ORIGIN}}"

          if aws lambda get-function --function-name "$FN_NAME" >/dev/null 2>&1; then
            echo "Updating existing Lambda $FN_NAME"
            aws lambda update-function-code --function-name "$FN_NAME" \
              --zip-file "fileb://${ZIP}" >/dev/null
            aws lambda wait function-updated --function-name "$FN_NAME"
            aws lambda update-function-configuration --function-name "$FN_NAME" \
              --handler lambda.handler --runtime nodejs20.x --timeout 30 --memory-size 512 \
              --environment "$ENV_VARS" >/dev/null
            aws lambda wait function-updated --function-name "$FN_NAME"
          else
            echo "Creating Lambda $FN_NAME"
            aws lambda create-function --function-name "$FN_NAME" \
              --runtime nodejs20.x --handler lambda.handler \
              --role "$ROLE_ARN" --timeout 30 --memory-size 512 \
              --environment "$ENV_VARS" \
              --zip-file "fileb://${ZIP}" >/dev/null
            aws lambda wait function-active --function-name "$FN_NAME"
          fi

          LAMBDA_ARN=$(aws lambda get-function --function-name "$FN_NAME" \
            --query 'Configuration.FunctionArn' --output text)

          API_ID=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='${API_NAME}'].ApiId | [0]" --output text)

          if [ "$API_ID" = "None" ] || [ -z "$API_ID" ]; then
            echo "Creating HTTP API $API_NAME (quick create)"
            API_ENDPOINT=$(aws apigatewayv2 create-api --name "$API_NAME" \
              --protocol-type HTTP --target "$LAMBDA_ARN" \
              --query 'ApiEndpoint' --output text)
            API_ID=$(aws apigatewayv2 get-apis \
              --query "Items[?Name=='${API_NAME}'].ApiId | [0]" --output text)
          else
            echo "HTTP API $API_NAME already exists ($API_ID)"
            API_ENDPOINT=$(aws apigatewayv2 get-api --api-id "$API_ID" \
              --query 'ApiEndpoint' --output text)
          fi

          # Ensure API Gateway can invoke the Lambda (idempotent)
          aws lambda add-permission --function-name "$FN_NAME" \
            --statement-id apigw-invoke --action lambda:InvokeFunction \
            --principal apigateway.amazonaws.com \
            --source-arn "arn:aws:execute-api:us-west-2:$(aws sts get-caller-identity --query Account --output text):${API_ID}/*/*" \
            >/dev/null 2>&1 || echo "Invoke permission already present"

          echo "api_url=${API_ENDPOINT}" >> $GITHUB_OUTPUT
          echo "Backend API: ${API_ENDPOINT}"

      - name: Seed shared dev DynamoDB (idempotent)
        if: github.actor != 'dependabot[bot]'
        run: |
          set -euo pipefail
          cd apps/backend
          DYNAMODB_TABLE=dev-jouster-conversations AWS_REGION=us-west-2 \
            node scripts/seed-dev-conversations.js

      - name: Write runtime config.json into build
        if: github.actor != 'dependabot[bot]'
        run: |
          set -euo pipefail
          cat > dist/apps/jouster-ui/browser/config.json << EOF
          {
            "apiBaseUrl": "${{ steps.backend.outputs.api_url }}",
            "environment": "preview-pr${{ github.event.pull_request.number }}"
          }
          EOF
          echo "config.json:"; cat dist/apps/jouster-ui/browser/config.json


      - name: Create S3 bucket (if it doesn't exist)
        if: github.actor != 'dependabot[bot]'
        run: |
          BUCKET_NAME="${{ steps.bucket.outputs.name }}"

          # Check if bucket exists
          if aws s3 ls "s3://${BUCKET_NAME}" 2>&1 | grep -q 'NoSuchBucket'; then
            echo "Creating bucket: ${BUCKET_NAME}"
            aws s3 mb "s3://${BUCKET_NAME}" --region us-west-2
          else
            echo "Bucket already exists: ${BUCKET_NAME}"
          fi
          # Access (OAC bucket policy, Block Public Access, HTTPS redirect) is configured after the
          # CloudFront distribution exists, so an older public bucket keeps serving until it's migrated.

      - name: Create GitHub deployment
        if: github.actor != 'dependabot[bot]'
        id: deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: `pr-preview-${context.issue.number}`,
              auto_merge: false,
              required_contexts: [],
              description: `PR #${context.issue.number} Preview`,
              transient_environment: true,
              production_environment: false,
            });
            core.setOutput('id', deployment.data.id);

      - name: Deploy to S3
        if: github.actor != 'dependabot[bot]'
        run: |
          echo "Deploying to S3 bucket: ${{ steps.bucket.outputs.name }}"
          aws s3 sync dist/apps/jouster-ui/browser/ "s3://${{ steps.bucket.outputs.name }}" \
            --delete \
            --cache-control "public, max-age=3600" \
            --metadata-directive REPLACE

          echo "Deployment complete!"

      # S3 website endpoints are HTTP-only, so each preview is served through its own CloudFront
      # distribution using the existing *.jouster.org ACM certificate (same pattern as QA).
      # CloudFront reads the private bucket via Origin Access Control, and the bucket's website
      # endpoint redirects every request to the HTTPS domain, so plain HTTP never serves content.
      # Idempotent: reuses the distribution that already has this PR's alias, otherwise creates one.
      - name: Ensure preview CloudFront distribution (HTTPS)
        if: github.actor != 'dependabot[bot]'
        id: cdn
        env:
          BUCKET_NAME: ${{ steps.bucket.outputs.name }}
          PREVIEW_DOMAIN: ${{ steps.bucket.outputs.domain }}
          PREVIEW_ORIGIN: ${{ steps.bucket.outputs.origin }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          OAC_ID=$(bash .github/scripts/s3-origin-https.sh oac)

          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Quantity > \`0\` && contains(Aliases.Items, '${PREVIEW_DOMAIN}')].Id | [0]" \
            --output text)

          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            CERT_ARN=$(aws acm list-certificates --region us-east-1 --certificate-statuses ISSUED \
              --includes keyTypes=RSA_2048,EC_prime256v1 \
              --query "CertificateSummaryList[?DomainName=='*.jouster.org'].CertificateArn | [0]" \
              --output text)
            if [ -z "$CERT_ARN" ] || [ "$CERT_ARN" = "None" ]; then
              echo "::error::No issued *.jouster.org certificate found in ACM us-east-1"
              exit 1
            fi

            # Managed policies: CachingOptimized and SecurityHeadersPolicy (adds HSTS etc.).
            jq -n \
              --arg ref "jouster-preview-pr${PR_NUM}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --arg comment "Jouster preview PR #${PR_NUM} (${PREVIEW_DOMAIN})" \
              --arg domain "$PREVIEW_DOMAIN" \
              --arg origin "$PREVIEW_ORIGIN" \
              --arg oac "$OAC_ID" \
              --arg cert "$CERT_ARN" '{
                CallerReference: $ref,
                Comment: $comment,
                Enabled: true,
                Aliases: { Quantity: 1, Items: [$domain] },
                DefaultRootObject: "index.html",
                PriceClass: "PriceClass_100",
                HttpVersion: "http2and3",
                IsIPV6Enabled: true,
                Origins: { Quantity: 1, Items: [{
                  Id: "preview-s3",
                  DomainName: $origin,
                  OriginPath: "",
                  CustomHeaders: { Quantity: 0 },
                  S3OriginConfig: { OriginAccessIdentity: "" },
                  OriginAccessControlId: $oac
                }]},
                DefaultCacheBehavior: {
                  TargetOriginId: "preview-s3",
                  ViewerProtocolPolicy: "redirect-to-https",
                  Compress: true,
                  CachePolicyId: "658327ea-f89d-4fab-a63d-7e88639e58f6",
                  ResponseHeadersPolicyId: "67f7725c-6f97-4210-82d7-5512b31e9d03",
                  AllowedMethods: {
                    Quantity: 2, Items: ["GET", "HEAD"],
                    CachedMethods: { Quantity: 2, Items: ["GET", "HEAD"] }
                  }
                },
                CustomErrorResponses: { Quantity: 2, Items: [
                  { ErrorCode: 403, ResponsePagePath: "/index.html", ResponseCode: "200", ErrorCachingMinTTL: 10 },
                  { ErrorCode: 404, ResponsePagePath: "/index.html", ResponseCode: "200", ErrorCachingMinTTL: 10 }
                ]},
                ViewerCertificate: {
                  ACMCertificateArn: $cert,
                  SSLSupportMethod: "sni-only",
                  MinimumProtocolVersion: "TLSv1.2_2021"
                }
              }' > preview-distribution.json

            DIST_ID=$(aws cloudfront create-distribution \
              --distribution-config file://preview-distribution.json \
              --query 'Distribution.Id' --output text)
            echo "Created CloudFront distribution $DIST_ID for ${PREVIEW_DOMAIN}"
          else
            echo "Using existing CloudFront distribution $DIST_ID for ${PREVIEW_DOMAIN}"
          fi

          # Re-enables a distribution left disabled by an unfinished close (e.g. PR reopened), moves
          # previews created before OAC to the private origin, locks the bucket to CloudFront and
          # redirects the HTTP website endpoint to HTTPS.
          ENSURE_ENABLED=true bash .github/scripts/s3-origin-https.sh secure "$BUCKET_NAME" "$PREVIEW_DOMAIN"

          STATUS=$(aws cloudfront get-distribution --id "$DIST_ID" --query 'Distribution.Status' --output text)
          if [ "$STATUS" != "Deployed" ]; then
            echo "Waiting for distribution $DIST_ID to finish deploying (status: $STATUS)..."
            aws cloudfront wait distribution-deployed --id "$DIST_ID"
          fi

          CF_DOMAIN=$(aws cloudfront get-distribution --id "$DIST_ID" --query 'Distribution.DomainName' --output text)
          echo "id=$DIST_ID" >> "$GITHUB_OUTPUT"
          echo "domain=$CF_DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Point preview domain at CloudFront
        if: github.actor != 'dependabot[bot]'
        env:
          PREVIEW_DOMAIN: ${{ steps.bucket.outputs.domain }}
          CF_DOMAIN: ${{ steps.cdn.outputs.domain }}
        run: |
          set -euo pipefail
          ZONE_ID=$(aws route53 list-hosted-zones-by-name --dns-name jouster.org \
            --query "HostedZones[?Name=='jouster.org.'].Id | [0]" --output text | sed 's|/hostedzone/||')
          if [ -z "$ZONE_ID" ] || [ "$ZONE_ID" = "None" ]; then
            echo "::error::Route 53 hosted zone for jouster.org not found"
            exit 1
          fi

          # Z2FDTNDATAQYW2 is the fixed hosted zone ID for all CloudFront alias targets.
          jq -n --arg name "${PREVIEW_DOMAIN}." --arg target "$CF_DOMAIN" '{
            Comment: "Serve PR preview through CloudFront (HTTPS)",
            Changes: (["A", "AAAA"] | map({
              Action: "UPSERT",
              ResourceRecordSet: {
                Name: $name,
                Type: .,
                AliasTarget: { HostedZoneId: "Z2FDTNDATAQYW2", DNSName: $target, EvaluateTargetHealth: false }
              }
            }))
          }' > preview-dns-change.json

          aws route53 change-resource-record-sets --hosted-zone-id "$ZONE_ID" --change-batch file://preview-dns-change.json
          echo "${PREVIEW_DOMAIN} now aliases ${CF_DOMAIN}"

      - name: Invalidate preview CloudFront cache
        if: github.actor != 'dependabot[bot]'
        run: |
          aws cloudfront create-invalidation --distribution-id "${{ steps.cdn.outputs.id }}" --paths '/*' \
            --query 'Invalidation.Id' --output text
          echo "Preview URL: ${{ steps.bucket.outputs.url }}"

      - name: Update deployment status
        if: github.actor != 'dependabot[bot]'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.id }},
              state: 'success',
              environment_url: '${{ steps.bucket.outputs.url }}',
              log_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              description: 'Preview deployed successfully',
            });

      - name: Comment preview URL on PR
        if: github.actor != 'dependabot[bot]'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const previewUrl = '${{ steps.bucket.outputs.url }}';
            const sha = context.sha.substring(0, 7);
            const branch = context.payload.pull_request.head.ref;
            const timestamp = new Date().toISOString().replace('T', ' ').split('.')[0] + ' UTC';

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('<!-- preview-comment -->')
            );

            const apiUrl = '${{ steps.backend.outputs.api_url }}';
            const commentBody = [
              '<!-- preview-comment -->',
              '## ?? Preview Environment Deployed!',
              '',
              '| | |',
              '|---|---|',
              `| ?? **Preview URL** | [${previewUrl}](${previewUrl}) |`,
              `| ?? **API URL** | [${apiUrl}](${apiUrl}/health) |`,
              `| ?? **Artifact** | \`jouster-ui-build-pr${prNumber}\` |`,
              `| ?? **Branch** | \`${branch}\` |`,
              `| ?? **Commit** | \`${sha}\` |`,
              `| ?? **Deployed** | ${timestamp} |`,
              `| ?? **Build Log** | [View Run](${runUrl}) |`,
              '',
              'The frontend talks to a per-PR Express-on-Lambda backend, backed by the shared **dev** DynamoDB',
              'seeded with fake data (full functionality, no prod data).',
              '',
              '### ?? Testing Instructions',
              '',
              '1. Visit the preview URL above',
              '2. Test your changes in the deployed environment',
              '3. Report any issues in this PR',
              '',
              '---',
              '*Preview (frontend + backend) auto-deletes when this PR is closed or merged.*',
            ].join('\n');

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody,
              });
            }

