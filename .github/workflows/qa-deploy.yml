name: 'Deploy Frontend: QA (qa.jouster.org)'

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  NODE_OPTIONS: '--max_old_space_size=7168'

permissions:
  id-token: write
  contents: read

concurrency:
  group: frontend-qa
  cancel-in-progress: true

jobs:
  deploy-qa:
    runs-on: ubuntu-latest
    # Allows for the one-time wait while a new CloudFront distribution deploys (up to ~35 min).
    timeout-minutes: 75

    environment:
      name: qa
      url: https://qa.jouster.org

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.19.0'

    - name: Cache node_modules
      id: cache-node-modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          node-modules-${{ runner.os }}-

    - name: Install dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      run: npm install --prefer-offline --no-audit --no-fund
      timeout-minutes: 25
      env:
        NODE_OPTIONS: '--max_old_space_size=7168'

    - name: Build application for QA
      run: |
        npm run build:prod
        echo "Built jouster-ui for QA environment"
      env:
        NODE_OPTIONS: '--max_old_space_size=7168'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    - name: Create QA S3 bucket if not exists
      run: |
        if ! aws s3api head-bucket --bucket qa.jouster.org 2>/dev/null; then
          echo "Creating QA S3 bucket..."
          aws s3 mb s3://qa.jouster.org --region us-west-2

          # Configure bucket for static website hosting
          aws s3 website s3://qa.jouster.org --index-document index.html --error-document index.html

          # Remove public access blocks
          aws s3api put-public-access-block \
            --bucket qa.jouster.org \
            --public-access-block-configuration "BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false"

          # Apply public read policy
          aws s3api put-bucket-policy \
            --bucket qa.jouster.org \
            --policy '{
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "PublicReadGetObject",
                  "Effect": "Allow",
                  "Principal": "*",
                  "Action": "s3:GetObject",
                  "Resource": "arn:aws:s3:::qa.jouster.org/*"
                }
              ]
            }'
          echo "QA S3 bucket created and configured"
        else
          echo "QA S3 bucket already exists"
        fi

    # Lets "Promote Frontend: QA → Staging" report and verify exactly which commit it is shipping.
    - name: Write build-info.json
      run: |
        jq -n --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF_NAME" --arg run "$GITHUB_RUN_ID" \
          --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          '{sha: $sha, ref: $ref, runId: $run, builtAt: $builtAt}' \
          > dist/apps/jouster-ui/browser/build-info.json
        cat dist/apps/jouster-ui/browser/build-info.json

    - name: Deploy to QA S3 bucket
      run: |
        echo "Deploying to QA environment..."
        aws s3 sync dist/apps/jouster-ui/browser/ s3://qa.jouster.org --delete --region us-west-2
        echo "✅ Deployment to qa.jouster.org complete!"

    # S3 website endpoints are HTTP-only, so QA is served through CloudFront using the
    # existing *.jouster.org ACM certificate. Idempotent: reuses the distribution that
    # already has the qa.jouster.org alias, otherwise creates one.
    - name: Ensure QA CloudFront distribution (HTTPS)
      id: cdn
      env:
        QA_DOMAIN: qa.jouster.org
        QA_ORIGIN: qa.jouster.org.s3-website-us-west-2.amazonaws.com
      run: |
        set -euo pipefail
        DIST_ID=$(aws cloudfront list-distributions \
          --query "DistributionList.Items[?Aliases.Quantity > \`0\` && contains(Aliases.Items, '${QA_DOMAIN}')].Id | [0]" \
          --output text)

        if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
          CERT_ARN=$(aws acm list-certificates --region us-east-1 --certificate-statuses ISSUED \
            --includes keyTypes=RSA_2048,EC_prime256v1 \
            --query "CertificateSummaryList[?DomainName=='*.jouster.org'].CertificateArn | [0]" \
            --output text)
          if [ -z "$CERT_ARN" ] || [ "$CERT_ARN" = "None" ]; then
            echo "::error::No issued *.jouster.org certificate found in ACM us-east-1"
            exit 1
          fi

          # Managed policies: CachingOptimized and SecurityHeadersPolicy (adds HSTS etc.).
          jq -n \
            --arg ref "jouster-qa-${GITHUB_RUN_ID}" \
            --arg domain "$QA_DOMAIN" \
            --arg origin "$QA_ORIGIN" \
            --arg cert "$CERT_ARN" '{
              CallerReference: $ref,
              Comment: "Jouster QA (\($domain))",
              Enabled: true,
              Aliases: { Quantity: 1, Items: [$domain] },
              DefaultRootObject: "index.html",
              PriceClass: "PriceClass_100",
              HttpVersion: "http2and3",
              IsIPV6Enabled: true,
              Origins: { Quantity: 1, Items: [{
                Id: "qa-s3-website",
                DomainName: $origin,
                OriginPath: "",
                CustomHeaders: { Quantity: 0 },
                CustomOriginConfig: {
                  HTTPPort: 80,
                  HTTPSPort: 443,
                  OriginProtocolPolicy: "http-only",
                  OriginSslProtocols: { Quantity: 1, Items: ["TLSv1.2"] },
                  OriginReadTimeout: 30,
                  OriginKeepaliveTimeout: 5
                }
              }]},
              DefaultCacheBehavior: {
                TargetOriginId: "qa-s3-website",
                ViewerProtocolPolicy: "redirect-to-https",
                Compress: true,
                CachePolicyId: "658327ea-f89d-4fab-a63d-7e88639e58f6",
                ResponseHeadersPolicyId: "67f7725c-6f97-4210-82d7-5512b31e9d03",
                AllowedMethods: {
                  Quantity: 2, Items: ["GET", "HEAD"],
                  CachedMethods: { Quantity: 2, Items: ["GET", "HEAD"] }
                }
              },
              CustomErrorResponses: { Quantity: 1, Items: [{
                ErrorCode: 404, ResponsePagePath: "/index.html", ResponseCode: "200", ErrorCachingMinTTL: 10
              }]},
              ViewerCertificate: {
                ACMCertificateArn: $cert,
                SSLSupportMethod: "sni-only",
                MinimumProtocolVersion: "TLSv1.2_2021"
              }
            }' > qa-distribution.json

          DIST_ID=$(aws cloudfront create-distribution \
            --distribution-config file://qa-distribution.json \
            --query 'Distribution.Id' --output text)
          echo "Created CloudFront distribution $DIST_ID for ${QA_DOMAIN}"
        else
          echo "Using existing CloudFront distribution $DIST_ID for ${QA_DOMAIN}"
        fi

        # Cut DNS over only once the distribution is live, so QA stays reachable during the first rollout.
        STATUS=$(aws cloudfront get-distribution --id "$DIST_ID" --query 'Distribution.Status' --output text)
        if [ "$STATUS" != "Deployed" ]; then
          echo "Waiting for distribution $DIST_ID to finish deploying (status: $STATUS)..."
          aws cloudfront wait distribution-deployed --id "$DIST_ID"
        fi

        CF_DOMAIN=$(aws cloudfront get-distribution --id "$DIST_ID" --query 'Distribution.DomainName' --output text)
        echo "id=$DIST_ID" >> "$GITHUB_OUTPUT"
        echo "domain=$CF_DOMAIN" >> "$GITHUB_OUTPUT"

    # Replaces the legacy CNAME to the S3 website endpoint with A/AAAA aliases to CloudFront.
    - name: Point qa.jouster.org at CloudFront
      env:
        QA_DOMAIN: qa.jouster.org
        CF_DOMAIN: ${{ steps.cdn.outputs.domain }}
      run: |
        set -euo pipefail
        ZONE_ID=$(aws route53 list-hosted-zones-by-name --dns-name jouster.org \
          --query "HostedZones[?Name=='jouster.org.'].Id | [0]" --output text | sed 's|/hostedzone/||')
        if [ -z "$ZONE_ID" ] || [ "$ZONE_ID" = "None" ]; then
          echo "::error::Route 53 hosted zone for jouster.org not found"
          exit 1
        fi

        LEGACY_CNAME=$(aws route53 list-resource-record-sets --hosted-zone-id "$ZONE_ID" \
          --query "ResourceRecordSets[?Name=='${QA_DOMAIN}.' && Type=='CNAME'] | [0]" --output json)

        # Z2FDTNDATAQYW2 is the fixed hosted zone ID for all CloudFront alias targets.
        jq -n --arg name "${QA_DOMAIN}." --arg target "$CF_DOMAIN" --argjson cname "$LEGACY_CNAME" '{
          Comment: "Serve QA through CloudFront (HTTPS)",
          Changes: (
            (if $cname then [{ Action: "DELETE", ResourceRecordSet: $cname }] else [] end) +
            (["A", "AAAA"] | map({
              Action: "UPSERT",
              ResourceRecordSet: {
                Name: $name,
                Type: .,
                AliasTarget: { HostedZoneId: "Z2FDTNDATAQYW2", DNSName: $target, EvaluateTargetHealth: false }
              }
            }))
          )
        }' > qa-dns-change.json

        aws route53 change-resource-record-sets --hosted-zone-id "$ZONE_ID" --change-batch file://qa-dns-change.json
        echo "? ${QA_DOMAIN} now aliases ${CF_DOMAIN}"

    - name: Invalidate QA CloudFront cache
      run: |
        aws cloudfront create-invalidation --distribution-id "${{ steps.cdn.outputs.id }}" --paths '/*' \
          --query 'Invalidation.Id' --output text

    - name: Post deployment info
      run: |
        echo "?? QA Deployment Complete!"
        echo "QA Environment URLs:"
        echo "- Custom Domain: https://qa.jouster.org (CloudFront ${{ steps.cdn.outputs.domain }})"
        echo "- S3 Origin (HTTP only): http://qa.jouster.org.s3-website-us-west-2.amazonaws.com"
        echo "- Build: ${{ github.sha }}"
        echo "- Branch: ${{ github.ref_name }}"
