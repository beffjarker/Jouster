name: Delete PR Preview Environment

on:
  pull_request:
    types: [closed]
    branches:
      - main

env:
  AWS_REGION: us-west-2

permissions:
  pull-requests: write
  contents: read

jobs:
  cleanup-preview:
    runs-on: ubuntu-latest
    # CloudFront must be disabled and fully redeployed before it can be deleted (~5-20 min).
    timeout-minutes: 45

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Generate preview bucket name
        id: bucket
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          BUCKET_NAME="jouster-preview-pr${PR_NUM}"
          DOMAIN="pr${PR_NUM}-preview.jouster.org"
          echo "name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "origin=${BUCKET_NAME}.s3-website-us-west-2.amazonaws.com" >> $GITHUB_OUTPUT
          echo "domain=$DOMAIN" >> $GITHUB_OUTPUT
          echo "url=https://${DOMAIN}" >> $GITHUB_OUTPUT

      # Order matters: DNS first, then CloudFront, then the bucket. Deleting the bucket while a
      # live distribution/DNS record still points at its name would allow a bucket-name takeover.
      - name: Delete Route53 DNS records (if they exist)
        continue-on-error: true
        id: delete-dns
        env:
          DOMAIN: ${{ steps.bucket.outputs.domain }}
          BUCKET_NAME: ${{ steps.bucket.outputs.name }}
        run: |
          set -euo pipefail
          echo "🔍 Checking for DNS records for: ${DOMAIN}"

          ZONE_ID=$(aws route53 list-hosted-zones-by-name --dns-name jouster.org \
            --query "HostedZones[?Name=='jouster.org.'].Id | [0]" --output text | sed 's|/hostedzone/||')
          if [ -z "$ZONE_ID" ] || [ "$ZONE_ID" = "None" ]; then
            echo "⚠️  No Route53 hosted zone found for jouster.org"
            echo "status=not_found" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Includes the legacy ${BUCKET_NAME}.jouster.org name from the pre-HTTPS preview setup.
          aws route53 list-resource-record-sets --hosted-zone-id "$ZONE_ID" --output json \
            | jq --arg a "${DOMAIN}." --arg b "${BUCKET_NAME}.jouster.org." '{
                Comment: "Remove PR preview DNS",
                Changes: [.ResourceRecordSets[]
                  | select((.Name == $a or .Name == $b) and (.Type == "A" or .Type == "AAAA" or .Type == "CNAME"))
                  | { Action: "DELETE", ResourceRecordSet: . }]
              }' > preview-dns-delete.json

          if [ "$(jq '.Changes | length' preview-dns-delete.json)" = "0" ]; then
            echo "⚠️  No DNS records found for ${DOMAIN}"
            echo "status=not_found" >> $GITHUB_OUTPUT
          else
            jq -r '.Changes[].ResourceRecordSet | "Deleting \(.Type) \(.Name)"' preview-dns-delete.json
            aws route53 change-resource-record-sets --hosted-zone-id "$ZONE_ID" \
              --change-batch file://preview-dns-delete.json >/dev/null
            echo "✅ DNS records deleted"
            echo "status=deleted" >> $GITHUB_OUTPUT
          fi

      - name: Delete CloudFront distribution (if it exists)
        continue-on-error: true
        id: delete-cloudfront
        env:
          DOMAIN: ${{ steps.bucket.outputs.domain }}
          ORIGIN: ${{ steps.bucket.outputs.origin }}
        run: |
          set -euo pipefail
          echo "🔍 Checking for CloudFront distribution for: ${DOMAIN}"

          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?(Aliases.Quantity > \`0\` && contains(Aliases.Items, '${DOMAIN}')) || Origins.Items[0].DomainName == '${ORIGIN}'].Id | [0]" \
            --output text)

          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "⚠️  No CloudFront distribution found for ${DOMAIN}"
            echo "status=not_found" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "✅ Found CloudFront distribution: ${DIST_ID}"
          aws cloudfront get-distribution-config --id "$DIST_ID" > preview-dist-current.json
          if [ "$(jq -r '.DistributionConfig.Enabled' preview-dist-current.json)" = "true" ]; then
            echo "Disabling distribution..."
            jq '.DistributionConfig | .Enabled = false' preview-dist-current.json > preview-dist-disabled.json
            aws cloudfront update-distribution --id "$DIST_ID" \
              --distribution-config file://preview-dist-disabled.json \
              --if-match "$(jq -r '.ETag' preview-dist-current.json)" >/dev/null
          fi

          # Record the partial state so a failure below is reported accurately.
          echo "status=disabled" >> $GITHUB_OUTPUT
          echo "Waiting for the disabled distribution to deploy (can take several minutes)..."
          aws cloudfront wait distribution-deployed --id "$DIST_ID"

          ETAG=$(aws cloudfront get-distribution --id "$DIST_ID" --query 'ETag' --output text)
          aws cloudfront delete-distribution --id "$DIST_ID" --if-match "$ETAG"
          echo "✅ CloudFront distribution deleted: ${DIST_ID}"
          echo "status=deleted" >> $GITHUB_OUTPUT

      - name: Delete preview S3 bucket and contents
        # Keep the bucket name claimed if DNS could not be removed; the scheduled cleanup retries later.
        if: steps.delete-dns.outcome == 'success'
        continue-on-error: true
        id: delete-s3
        run: |
          BUCKET_NAME="${{ steps.bucket.outputs.name }}"

          echo "🧹 Cleaning up preview environment for PR #${{ github.event.pull_request.number }}"
          echo "Bucket: ${BUCKET_NAME}"

          # Check if bucket exists
          if aws s3 ls "s3://${BUCKET_NAME}" 2>&1 | grep -q 'NoSuchBucket'; then
            echo "⚠️  Bucket does not exist: ${BUCKET_NAME}"
            echo "Nothing to clean up."
            echo "status=not_found" >> $GITHUB_OUTPUT
          else
            echo "✅ Bucket found: ${BUCKET_NAME}"

            # Delete all objects in the bucket (required before deleting bucket)
            echo "Deleting all objects in bucket..."
            aws s3 rm "s3://${BUCKET_NAME}" --recursive

            # Delete the bucket itself
            echo "Deleting bucket..."
            aws s3 rb "s3://${BUCKET_NAME}" --force

            echo "✅ Bucket deleted successfully: ${BUCKET_NAME}"
            echo "status=deleted" >> $GITHUB_OUTPUT
          fi

      - name: Delete preview backend (Lambda + HTTP API)
        run: |
          set -uo pipefail
          PR_NUM="${{ github.event.pull_request.number }}"
          FN_NAME="preview-pr${PR_NUM}-jouster-api"
          API_NAME="preview-pr${PR_NUM}-jouster-api"

          echo "🧹 Removing backend for PR #${PR_NUM}"

          # Delete the HTTP API (removes routes, integration, stage)
          API_ID=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='${API_NAME}'].ApiId | [0]" --output text 2>/dev/null)
          if [ "$API_ID" != "None" ] && [ -n "$API_ID" ]; then
            echo "Deleting HTTP API ${API_NAME} (${API_ID})"
            aws apigatewayv2 delete-api --api-id "$API_ID" && echo "✅ API deleted"
          else
            echo "⚠️  No HTTP API found for ${API_NAME}"
          fi

          # Delete the Lambda function
          if aws lambda get-function --function-name "$FN_NAME" >/dev/null 2>&1; then
            echo "Deleting Lambda ${FN_NAME}"
            aws lambda delete-function --function-name "$FN_NAME" && echo "✅ Lambda deleted"
          else
            echo "⚠️  No Lambda found for ${FN_NAME}"
          fi

          echo "Note: shared IAM role and dev DynamoDB table are intentionally preserved."

      - name: Comment cleanup status on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;
            const bucketName = '${{ steps.bucket.outputs.name }}';
            const previewUrl = '${{ steps.bucket.outputs.url }}';
            const statuses = {
              dns: '${{ steps.delete-dns.outputs.status }}' || '${{ steps.delete-dns.outcome }}',
              cloudfront: '${{ steps.delete-cloudfront.outputs.status }}' || '${{ steps.delete-cloudfront.outcome }}',
              s3: '${{ steps.delete-s3.outputs.status }}' || '${{ steps.delete-s3.outcome }}',
            };
            const cfFailed = '${{ steps.delete-cloudfront.outcome }}' === 'failure';
            const label = (status, failed = false) => {
              if (failed) return `❌ Failed (${status || 'unknown'}) - scheduled cleanup will retry`;
              if (status === 'deleted') return '✅ Deleted';
              if (status === 'not_found') return '➖ None found';
              if (status === 'skipped') return '⏸️ Skipped (DNS removal failed) - scheduled cleanup will retry';
              return `❌ ${status || 'unknown'} - scheduled cleanup will retry`;
            };
            const allClean = [statuses.dns, statuses.s3].every((s) => s === 'deleted' || s === 'not_found') &&
              !cfFailed && (statuses.cloudfront === 'deleted' || statuses.cloudfront === 'not_found');

            const commentBody = `## 🧹 Preview Environment Cleaned Up

            🔗 **Preview URL (now inactive):** ~~${previewUrl}~~

            ### Cleanup Summary

            | Resource | Status |
            |----------|--------|
            | DNS Records | ${label(statuses.dns)} |
            | CloudFront Distribution (HTTPS) | ${label(statuses.cloudfront, cfFailed)} |
            | S3 Bucket \`${bucketName}\` | ${label(statuses.s3)} |
            | Lambda (backend API) | ✅ Deleted |
            | API Gateway (HTTP API) | ✅ Deleted |

            ### Details

            - **PR:** #${prNumber}
            - **Bucket:** \`${bucketName}\`
            - **Cleaned up:** ${new Date().toISOString()}
            - **Triggered by:** PR ${context.payload.pull_request.merged ? 'merged' : 'closed'}

            ---

            ${allClean
              ? '*All preview environment resources have been removed from AWS.*'
              : '*Some resources could not be removed; the weekly scheduled cleanup will retry.*'}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody,
            });

      - name: Remove preview label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'preview-deployed'
              });
            } catch (error) {
              console.log('Label may not exist:', error.message);
            }

      - name: Cleanup summary
        run: |
          echo "========================================="
          echo "🧹 Preview Environment Cleanup Complete"
          echo "========================================="
          echo ""
          echo "PR Number: ${{ github.event.pull_request.number }}"
          echo "Bucket: ${{ steps.bucket.outputs.name }}"
          echo "Status: ${{ github.event.pull_request.merged && 'Merged' || 'Closed' }}"
          echo ""
          echo "Resources:"
          echo "  DNS records:  ${{ steps.delete-dns.outputs.status || steps.delete-dns.outcome }}"
          echo "  CloudFront:   ${{ steps.delete-cloudfront.outputs.status || steps.delete-cloudfront.outcome }} (step: ${{ steps.delete-cloudfront.outcome }})"
          echo "  S3 bucket:    ${{ steps.delete-s3.outputs.status || steps.delete-s3.outcome }}"
          echo ""
          echo "Preview URL no longer accessible:"
          echo "  ${{ steps.bucket.outputs.url }}"
          echo ""
          echo "========================================="

